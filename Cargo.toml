[package]
name = "agentaps"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol-schema = { version = "1.9.1", default-features = false, features = ["unstable_protocol_v2"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
