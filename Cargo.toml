[package]
name = "agentaps"
version = "0.2.1"
edition = "2024"
description = "Desktop client for agents that speak the Agent Client Protocol"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/agentaps"
readme = "README.md"
categories = ["gui"]

[dependencies]
agentaps-control-protocol = { path = "crates/control-protocol" }
agent-client-protocol-schema = { version = "1.9.1", default-features = false, features = ["unstable_protocol_v2"] }
etcetera = "0.11"
gix = { version = "0.88", default-features = false, features = ["status", "parallel", "sha1"] }
gix-imara-diff = "0.2.3"
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui-component = { package = "gpui_ce_components", version = "0.2.0" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "0.2.0" }
gpui_ce_platform = "0.1.0"
hex = "0.4"
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
nucleo = "0.5.0"
notify = "7"
qrcode = "0.14"
regex = "1"
secretspec = { version = "0.21", default-features = false, features = ["keyring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Component fixes pending in gpui-ce/gpui-component PRs 1 and 2.
gpui_ce_components = { git = "https://github.com/domenkozar/gpui-kit", rev = "0622a5332bb1da6e115ba5a8b8afecf4cddbd8b1" }
gpui_ce_components_base = { git = "https://github.com/domenkozar/gpui-kit", rev = "0622a5332bb1da6e115ba5a8b8afecf4cddbd8b1" }
gpui_ce_components_assets = { git = "https://github.com/domenkozar/gpui-kit", rev = "0622a5332bb1da6e115ba5a8b8afecf4cddbd8b1" }
gpui-ce = { git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a" }
gpui_ce_apple = { git = "https://github.com/gpui-ce/gpui-ce", rev = "17d9c8e8fdb30a329d817ca06bff424e8e848f1a" }
