[package]
name = "agentaps-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
agentaps-control-protocol = { path = "../crates/control-protocol" }
async-channel = "2"
getrandom = { version = "0.4", features = ["wasm_js"] }
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui-component = { package = "gpui_ce_components", version = "0.2.0" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "0.2.0" }
gpui_ce_platform = "0.1.0"
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
js-sys = "0.3"
rqrr = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Url"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui_ce_web = { path = "../vendor/gpui_ce_web" }
gpui_ce_wgpu = { path = "../vendor/gpui_ce_wgpu" }
gpui_ce_components_assets = { path = "../vendor/gpui_ce_components_assets" }
